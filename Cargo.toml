[package]
name = "week-parity-wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
chrono = { version = "0.4", features = ["serde"] }
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "MediaQueryList",
    "Response",
    "Window",
] }

[lib]
crate-type = ["cdylib", "rlib"]
